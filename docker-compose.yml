services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:






#docker commands for reference
#docker compose up -d , docker-tells your computer to use docker, compose-works with the services defined in compose file, up-creates and starts the containers if necessary,d-detached mode ,the containers run in the background and terminal is free to use
#docker compose ps, lists currently running docker containers,ps-process status